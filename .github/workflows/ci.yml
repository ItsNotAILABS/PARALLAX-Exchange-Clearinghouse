name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          rm -f pnpm-lock.yaml ../../pnpm-lock.yaml
          pnpm install --prefer-offline --no-frozen-lockfile --lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm check

      - name: Build
        run: pnpm build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          rm -f pnpm-lock.yaml ../../pnpm-lock.yaml
          pnpm install --prefer-offline --no-frozen-lockfile --lockfile=false

      - name: Run tests
        run: pnpm test

  notebook-validation:
    name: Notebook Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jupyter nbconvert numpy pandas matplotlib requests

      - name: Validate notebook syntax
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 PARALLAX_Software_Notebook.ipynb --output /tmp/validated.ipynb

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t parallax-frontend .

name: Sovereign Finance Gate

on:
  pull_request:
    paths:
      - 'apps/universal-trading/**'
      - 'scripts/validate-sovereign-finance.mjs'
      - 'package.json'
      - '.github/workflows/sovereign-finance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/universal-trading/**'
      - 'scripts/validate-sovereign-finance.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sovereign:validate
      - run: pnpm terminal:validate
      - run: pnpm launch:validate

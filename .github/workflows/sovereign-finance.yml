name: Sovereign Finance Gate

on:
  pull_request:
    paths:
      - 'apps/universal-trading/**'
      - 'scripts/validate-sovereign-finance.mjs'
      - 'package.json'
      - '.github/workflows/sovereign-finance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/universal-trading/**'
      - 'scripts/validate-sovereign-finance.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sovereign:validate
      - run: npm run terminal:validate
      - run: npm run launch:validate

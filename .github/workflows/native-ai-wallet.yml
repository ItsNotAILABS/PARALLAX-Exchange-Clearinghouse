name: Native AI Wallet

on:
  pull_request:
    paths:
      - 'src/native/ai-wallet/**'
      - 'docs/NATIVE_CPP_INTERFACE.md'
      - 'package.json'
      - '.github/workflows/native-ai-wallet.yml'
  push:
    branches:
      - main
    paths:
      - 'src/native/ai-wallet/**'
      - 'docs/NATIVE_CPP_INTERFACE.md'
      - 'package.json'
      - '.github/workflows/native-ai-wallet.yml'

jobs:
  native-ai-wallet:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S src/native/ai-wallet -B build/native/ai-wallet
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build/native/ai-wallet --config Release

      - name: Test
        run: ctest --test-dir build/native/ai-wallet --output-on-failure -C Release

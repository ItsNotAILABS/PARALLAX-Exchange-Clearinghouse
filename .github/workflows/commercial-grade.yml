name: Commercial Grade Gate

on:
  pull_request:
    paths:
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'apps/**'
      - 'package.json'
      - '.github/workflows/commercial-grade.yml'
  push:
    branches: [ main ]

jobs:
  commercial-grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run commercial grade validator
        run: node scripts/validate-commercial-grade.mjs

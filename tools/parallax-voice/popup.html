<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARALLAX Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #c4a0ff;
      letter-spacing: 0.5px;
    }
    .header .phi {
      font-size: 11px;
      color: #666;
    }
    .mic-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #1a1a2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      transition: all 0.3s ease;
    }
    .mic-btn:hover { border-color: #c4a0ff; background: #1f1f3a; }
    .mic-btn.active {
      border-color: #ff4444;
      background: #2a1a1a;
      animation: pulse 1.5s infinite;
    }
    .mic-btn svg { width: 28px; height: 28px; fill: #c4a0ff; }
    .mic-btn.active svg { fill: #ff4444; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(255, 68, 68, 0); }
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    .status.listening { color: #ff6666; }
    .transcript {
      background: #111118;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      min-height: 60px;
      max-height: 120px;
      overflow-y: auto;
      color: #ccc;
      line-height: 1.5;
    }
    .settings {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    select {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #ccc;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .hotkey-hint {
      text-align: center;
      font-size: 10px;
      color: #555;
      margin-top: 12px;
    }
    .hotkey-hint kbd {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⬡ PARALLAX VOICE</h1>
    <span class="phi">φ-driven STT</span>
  </div>

  <button class="mic-btn" id="micBtn">
    <svg viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </button>

  <div class="status" id="status">Click mic or press Ctrl+Shift+V to start</div>

  <div class="transcript" id="transcript">Your speech will appear here...</div>

  <div class="settings">
    <div class="setting-row">
      <span>Language</span>
      <select id="langSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="ja-JP">Japanese</option>
        <option value="zh-CN">Chinese</option>
      </select>
    </div>
    <div class="setting-row">
      <span>Auto-insert into focused field</span>
      <input type="checkbox" id="autoInsert" checked>
    </div>
  </div>

  <div class="hotkey-hint">
    Global hotkey: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>V</kbd>
  </div>

  <script src="popup.js"></script>
</body>
</html>
